name: runtime-local-pack
on:
  push:
    branches:
      - runtime-local-pack-20261003

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack source
        run: |
          tar --exclude=.git -czf /tmp/runtime-src.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-src
          path: /tmp/runtime-src.tar.gz
          if-no-files-found: error
